name: Deploy B1-1 portfolio for B3-1 practice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B1-1 static portfolio
        uses: actions/checkout@v4
        with:
          repository: usernameffas/codyssey-b1-1
          ref: main
          path: public
      - name: Validate static site files
        run: |
          test -s public/index.html
          test -d public/css
          test -d public/js
          test -d public/images
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
